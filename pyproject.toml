[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ecommerce-resolution-agent"
version = "0.1.0"
description = "Simulation-first multi-agent system that resolves ecommerce support tickets under a deterministic policy engine, with risk scoring, approval gates and a regression-gated eval harness"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Venom" }
]
dependencies = [
  "alembic>=1.14.0",
  "fastapi>=0.115.0",
  "langgraph>=0.3.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "psycopg[binary]>=3.2.0",
  "redis>=5.2.0",
  "sqlalchemy>=2.0.36",
  "typer>=0.12.5",
  "uvicorn>=0.32.0",
]

[project.scripts]
ecom-resolver = "ecom_resolution_agent.cli:app"

[dependency-groups]
dev = [
  "httpx>=0.28.0",
  "mypy>=1.13.0",
  "pytest>=8.3.0",
  "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ecom_resolution_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
pretty = true
